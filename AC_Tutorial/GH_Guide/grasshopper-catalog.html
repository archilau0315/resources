<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grasshopper 组件目录 - 啄之堂 · Rhino 8 原生组件参考</title>
<style>
:root {
  --bg: #141a26;
  --bg-2: #1b2333;
  --card: #1e2940;
  --card-hover: #24304d;
  --fg: #e8ecf4;
  --muted: #8a96b3;
  --accent: #00d4aa;
  --accent-2: #00a8e8;
  --accent-dim: rgba(0,212,170,.12);
  --border: #2a3550;
  --radius: 10px;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  color: var(--fg);
  min-height: 100vh;
}
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(20,26,38,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
}
.header-inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center; font-size: 20px; }
.logo h1 { font-size: 1.15rem; letter-spacing: -.3px; }
.logo small { display:block; color: var(--muted); font-size: .72rem; font-weight: 400; }
.search-wrap { flex: 1; min-width: 260px; max-width: 640px; position: relative; }
#searchInput {
  width: 100%; padding: 12px 16px 12px 44px; font-size: .95rem;
  background: #0e1420; color: var(--fg);
  border: 2px solid var(--border); border-radius: 10px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
#searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
#searchInput::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.autocomplete {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: #0e1420; border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); max-height: 340px; overflow-y: auto; display: none; z-index: 200;
}
.autocomplete.open { display: block; }
.ac-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.selected { background: var(--accent-dim); }
.ac-name { font-weight: 600; }
.ac-nick { color: var(--accent); font-family: Consolas, monospace; font-size: .75rem; }
.ac-addon { color: var(--muted); font-size: .7rem; margin-left: auto; }
.stats { display: flex; gap: 18px; font-size: .82rem; color: var(--muted); }
.stats strong { color: var(--accent); display: block; font-size: 1.05rem; }
main { max-width: 1500px; margin: 0 auto; padding: 18px 28px 60px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 20px; }
.chip {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 18px; cursor: pointer;
  background: transparent; color: var(--muted); font-size: .8rem; transition: all .12s; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--fg); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
.chip .cn { opacity: .75; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; cursor: default; transition: all .12s;
}
.card.has-detail { cursor: pointer; }
.card.has-detail:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-name { font-weight: 700; font-size: .95rem; }
.nick { font-family: Consolas, monospace; font-size: .7rem; color: var(--accent); background: var(--accent-dim); padding: 2px 6px; border-radius: 4px; }
.addon-badge { font-size: .65rem; color: var(--accent-2); border: 1px solid var(--border); padding: 2px 7px; border-radius: 4px; margin-left: auto; }
.card-desc { color: var(--muted); font-size: .82rem; margin-bottom: 8px; min-height: 2.4em; }
.card-foot { display: flex; align-items: center; gap: 8px; font-size: .68rem; color: var(--muted); }
.card-foot a { color: var(--accent-2); text-decoration: none; }
.card-foot a:hover { text-decoration: underline; }
.detail { display: none; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
.card.expanded .detail { display: block; }
.detail-title { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin: 8px 0 4px; }
.ptable { width: 100%; font-size: .75rem; border-collapse: collapse; }
.ptable th, .ptable td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
.ptable th { color: var(--muted); font-size: .65rem; text-transform: uppercase; }
.ptable .pname { font-family: Consolas, monospace; color: var(--accent); }
.ptable .ptype { color: #ffd166; }
.example { background: #0e1420; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: Consolas, monospace; font-size: .7rem; color: #9ec6f0; white-space: pre-wrap; line-height: 1.6; margin-top: 4px; }
.note { font-size: .72rem; color: var(--muted); margin-top: 6px; }
.expand-hint { font-size: .65rem; color: var(--muted); margin-left: auto; }
.empty { text-align: center; padding: 80px 20px; color: var(--muted); }
footer { border-top: 1px solid var(--border); padding: 18px; text-align: center; color: var(--muted); font-size: .78rem; }
footer a { color: var(--accent-2); text-decoration: none; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .stats { display: none; } header { padding: 10px 14px; } main { padding: 14px; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">

      <div><h1>Grasshopper 组件目录</h1><small>Rhino 8 · 原生组件参考 · 啄之堂</small></div>
    </div>
    <div class="search-wrap">

    </div>
  </div>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">未找到匹配的组件，请尝试其他关键词</div>
</main>

const ADDONS = [...new Set(COMPONENTS.map(c => c.addonZh + '|' + c.addon))].sort((a,b)=>a.localeCompare(b));
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const autocomplete = document.getElementById('autocomplete');
const filtersEl = document.getElementById('filters');
const emptyEl = document.getElementById('empty');
const statComponents = document.getElementById('statComponents');
const statDetailed = document.getElementById('statDetailed');

let activeAddon = 'all';
let currentTerm = '';
let selectedIndex = -1;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mark = (s, t) => {
  const e = esc(s);
  if (!t) return e;
  const escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return e.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark style="background:rgba(0,212,170,.28);color:var(--accent);padding:0 2px;border-radius:2px;">$1</mark>');
};

statComponents.textContent = COMPONENTS.length;
statDetailed.textContent = COMPONENTS.filter(c => c.detail).length;

// Build filter chips
function renderFilters() {
  let html = `<button class="chip active" data-addon="all">全部<span class="cn">(${COMPONENTS.length})</span></button>`;
  for (const pair of ADDONS) {
    const [zh, en] = pair.split('|');
    const n = COMPONENTS.filter(c => c.addon === en).length;
    html += `<button class="chip" data-addon="${en}">${esc(zh)}<span class="cn">(${n})</span></button>`;
  }
  filtersEl.innerHTML = html;
}
filtersEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  activeAddon = btn.dataset.addon;
  filtersEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === btn));
  render();
});

function filtered() {
  const t = currentTerm.toLowerCase();
  return COMPONENTS.filter(c => {
    if (activeAddon !== 'all' && c.addon !== activeAddon) return false;
    if (!t) return true;
    const hay = `${c.name} ${c.nick} ${c.desc} ${c.category} ${c.categoryZh} ${c.addon} ${c.addonZh}`.toLowerCase();
    return hay.includes(t);
  });
}

function paramTable(rows) {
  if (!rows.length) return '<p style="color:var(--muted);font-size:.75rem">无</p>';
  let h = '<table class="ptable"><thead><tr><th>名称</th><th>类型</th><th>说明</th></tr></thead><tbody>';
  for (const p of rows) h += `<tr><td class="pname">${esc(p.name)}</td><td class="ptype">${esc(p.type)}</td><td>${esc(p.desc)}</td></tr>`;
  return h + '</tbody></table>';
}

function cardHTML(c, term) {
  const has = c.detail;
  let h = `<article class="card${has ? ' has-detail' : ''}" data-name="${esc(c.name)}">`;
  h += `<div class="card-top"><span class="card-name">${mark(c.name, term)}</span>`;
  if (c.nick) h += `<span class="nick">${mark(c.nick, term)}</span>`;
  h += `<span class="addon-badge">${esc(c.addonZh)} · ${esc(c.categoryZh)}</span></div>`;
  h += `<p class="card-desc">${mark(c.desc, term) || '（暂无描述）'}</p>`;
  h += `<div class="card-foot"><a href="https://grasshopperdocs.com/components/${esc('grasshopper' + c.addon.toLowerCase().replace(/\s+/g, ''))}/${esc(c.slug)}.html" target="_blank" rel="noopener">官方资料 ↗</a>`;
  if (has) h += `<span class="expand-hint">点击展开参数详解 ▾</span>`;
  h += `</div>`;
  if (has) {
    h += `<div class="detail"><div class="detail-title">输入参数 Inputs</div>${paramTable(c.inputs)}`;
    h += `<div class="detail-title">输出参数 Outputs</div>${paramTable(c.outputs)}`;
    if (c.example) h += `<div class="detail-title">示例</div><div class="example">${esc(c.example)}</div>`;
    if (c.note) h += `<div class="note">${esc(c.note)}</div>`;
    h += `</div>`;
  }
  h += `</article>`;
  return h;
}

function render() {
  const list = filtered();
  grid.innerHTML = list.map(c => cardHTML(c, currentTerm)).join('');
  emptyEl.style.display = list.length ? 'none' : 'block';
}

function showAutocomplete(term) {
  const t = term.trim().toLowerCase();
  if (!t) { autocomplete.classList.remove('open'); return; }
  const matches = COMPONENTS.filter(c => `${c.name} ${c.nick}`.toLowerCase().includes(t)).slice(0, 10);
  if (!matches.length) { autocomplete.classList.remove('open'); return; }
  autocomplete.innerHTML = matches.map((c, i) =>
    `<div class="ac-item" data-name="${esc(c.name)}"><span class="ac-name">${mark(c.name, term)}</span>${c.nick ? `<span class="ac-nick">${esc(c.nick)}</span>` : ''}<span class="ac-addon">${esc(c.addonZh)}</span></div>`
  ).join('');
  autocomplete.classList.add('open');
  selectedIndex = -1;
}

searchInput.addEventListener('input', e => {
  currentTerm = e.target.value.trim().toLowerCase();
  showAutocomplete(currentTerm);
  render();
});
searchInput.addEventListener('keydown', e => {
  const items = autocomplete.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); selectedIndex = Math.min(selectedIndex + 1, items.length - 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectedIndex = Math.max(selectedIndex - 1, -1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const sel = autocomplete.querySelector('.ac-item.selected');
    if (sel) { searchInput.value = sel.dataset.name; currentTerm = sel.dataset.name.toLowerCase(); autocomplete.classList.remove('open'); render(); }
    return;
  } else if (e.key === 'Escape') { autocomplete.classList.remove('open'); return; } else return;
  items.forEach((el, i) => el.classList.toggle('selected', i === selectedIndex));
});
autocomplete.addEventListener('click', e => {
  const item = e.target.closest('.ac-item');
  if (!item) return;
  searchInput.value = item.dataset.name;
  currentTerm = item.dataset.name.toLowerCase();
  autocomplete.classList.remove('open');
  render();
});
document.addEventListener('click', e => {
  if (!searchInput.contains(e.target) && !autocomplete.contains(e.target)) autocomplete.classList.remove('open');
});
grid.addEventListener('click', e => {
  const card = e.target.closest('.card.has-detail');
  if (card && !e.target.closest('a')) card.classList.toggle('expanded');
});

renderFilters();
render();
</script>
</body>
</html>
