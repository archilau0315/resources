<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">组件目录 | Component Catalog</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .catalog-toolbar { display:flex; gap:12px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
  .catalog-stats { display:flex; gap:20px; font-size:13px; color:var(--muted); margin-bottom:20px; }
  .catalog-stats strong { color:var(--accent); font-size:16px; display:block; }
  .chip-group { display:flex; gap:8px; flex-wrap:wrap; }
  .catalog-chip { padding:6px 14px; border:1px solid var(--border); border-radius:20px; font-size:13px; color:var(--muted); cursor:pointer; background:var(--panel); transition:all var(--transition); white-space:nowrap; }
  .catalog-chip:hover { border-color:var(--accent); color:var(--text); }
  .catalog-chip.active { background:var(--accent); color:#000; border-color:var(--accent); }
  .catalog-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:16px; }
  .catalog-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px; transition:all var(--transition); cursor:default; }
  .catalog-card.has-detail { cursor:pointer; }
  .catalog-card.has-detail:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow); }
  .card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .card-name { font-size:15px; font-weight:800; color:var(--text); }
  .card-nick { font-family:Consolas,monospace; font-size:11px; color:var(--accent); background:rgba(56,189,248,0.12); padding:2px 8px; border-radius:6px; }
  .card-addon { font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-left:auto; }
  .card-desc { font-size:13px; color:var(--muted); margin-bottom:10px; line-height:1.5; min-height:3em; }
  .card-foot { display:flex; gap:8px; font-size:11px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .card-foot a { color:var(--accent-2,#22d3ee); text-decoration:none; }
  .card-foot a:hover { text-decoration:underline; }
  .detail { display:none; margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
  .catalog-card.expanded .detail { display:block; }
  .detail-title { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin:6px 0 4px; }
  .ptable { width:100%; font-size:12px; border-collapse:collapse; }
  .ptable th, .ptable td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); }
  .ptable th { color:var(--muted); font-size:10px; text-transform:uppercase; }
  .ptable .pname { font-family:Consolas,monospace; color:var(--accent); }
  .ptable .ptype { color:#fbbf24; }
  .example { background:#0e1420; border:1px solid var(--border); border-radius:6px; padding:10px 12px; font-family:Consolas,monospace; font-size:11px; color:#9ec6f0; white-space:pre-wrap; line-height:1.6; margin-top:6px; }
  .empty { text-align:center; padding:80px 24px; color:var(--muted); }
  .empty .emoji { font-size:48px; margin-bottom:16px; display:block; opacity:0.5; }
  .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:14px; margin-bottom:20px; }
  .back-link:hover { text-decoration:underline; }
  .lang-note { font-size:12px; color:var(--muted); text-align:center; margin-top:20px; }
  @media (max-width:768px) { .catalog-grid { grid-template-columns:1fr; } .catalog-toolbar { flex-direction:column; align-items:stretch; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="container">
    <a href="../index.html" class="brand" id="brandLink">GH <span>指南</span></a>
    <div class="lang-switch" id="langSwitch">EN</div>
  </div>
</header>

<div class="container" style="padding-top:24px;">
  <a href="../index.html#catalog" class="back-link" id="backLink">← 返回首页</a>

  <div class="catalog-toolbar">
    <div style="flex:1; min-width:260px; position:relative;">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索组件名 / 昵称 / 描述…" autocomplete="off" style="width:100%;padding:12px 20px 12px 44px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font-size:15px;outline:none;">
      <div id="autocomplete" class="autocomplete"></div>
    </div>
    <div class="chip-group" id="filterChips"></div>
  </div>

  <div class="catalog-stats">
    <div><strong id="statTotal">0</strong><span>组件</span></div>
    <div><strong id="statDetailed">0</strong><span>详解</span></div>
  </div>

  <div class="catalog-grid" id="catalogGrid"></div>
  <div id="emptyState" class="empty" style="display:none"><div class="emoji">🔍</div><p id="emptyText">未找到匹配的组件</p></div>

  <div class="lang-note" id="langNote">中英双语 · 右上角切换</div>
</div>

<script src="../assets/js/i18n.js"></script>
<script>
const COMPONENTS = [];
let catalogData = null;

async function loadCatalog() {
  const res = await fetch("../grasshopper-catalog.html");
  const text = await res.text();
  const match = text.match(/const COMPONENTS = (\[.*\]);/s);
  if (match) catalogData = JSON.parse(match[1]);
  else catalogData = [];
  return catalogData;
}

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

let activeAddon = "all";
let currentTerm = "";
let selectedIndex = -1;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mark(s, t){
  const e = esc(s);
  if (!t) return e;
  const escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return e.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark style="background:rgba(56,189,248,0.3);color:#38bdf8;padding:0 2px;border-radius:2px;">$1</mark>');
}

function getAddons(){
  const set = new Set();
  catalogData.forEach(c => set.add(c.addonZh + "|" + c.addon));
  return [...set].sort();
}

function renderFilters(){
  const container = $("#filterChips");
  const lang = I18N_API.getLang();
  const allLabel = lang === "zh" ? "全部" : "All";
  let html = `<button class="catalog-chip ${activeAddon==='all'?'active':''}" data-addon="all">${allLabel}<span style="opacity:.75;margin-left:4px;font-weight:400;">(${catalogData.length})</span></button>`;
  const addons = getAddons();
  addons.forEach(pair => {
    const [zh, en] = pair.split("|");
    const n = catalogData.filter(c => c.addon === en).length;
    const label = lang === "zh" ? zh : en;
    html += `<button class="catalog-chip ${activeAddon===en?'active':''}" data-addon="${en}">${esc(label)}<span style="opacity:.75;margin-left:4px;font-weight:400;">(${n})</span></button>`;
  });
  container.innerHTML = html;
  $$(".catalog-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      activeAddon = btn.dataset.addon;
      $$(".catalog-chip").forEach(c => c.classList.toggle("active", c === btn));
      render();
    });
  });
}

function filtered(){
  const t = currentTerm.toLowerCase();
  return catalogData.filter(c => {
    if (activeAddon !== "all" && c.addon !== activeAddon) return false;
    if (!t) return true;
    const hay = `${c.name} ${c.nick||""} ${c.desc||""} ${c.categoryZh||""} ${c.category||""} ${c.addonZh||""} ${c.addon||""}`.toLowerCase();
    return hay.includes(t);
  });
}

function paramTable(rows){
  if (!rows || !rows.length) return '<p style="color:var(--muted);font-size:11px">无</p>';
  let h = '<table class="ptable"><thead><tr><th>名称</th><th>类型</th><th>说明</th></tr></thead><tbody>';
  for (const p of rows) h += `<tr><td class="pname">${esc(p.name)}</td><td class="ptype">${esc(p.type)}</td><td>${esc(p.desc)}</td></tr>`;
  return h + '</tbody></table>';
}

function cardHTML(c, term){
  const has = c.detail && c.detail === true;
  const h = [];
  h.push(`<article class="catalog-card${has?' has-detail':''}" data-name="${esc(c.name)}">`);
  h.push(`<div class="card-top"><span class="card-name">${mark(c.name, term)}</span>`);
  if (c.nick) h.push(`<span class="card-nick">${mark(c.nick, term)}</span>`);
  h.push(`<span class="card-addon">${esc(c.addonZh || c.addon)} · ${esc(c.categoryZh || c.category)}</span></div>`);
  h.push(`<p class="card-desc">${mark(c.desc || "", term) || '（暂无描述）'}</p>`);
  h.push(`<div class="card-foot"><a href="https://grasshopperdocs.com/components/grasshopper${esc(c.addon||'').toLowerCase().replace(/\s+/g,'')}/${esc(c.slug||c.name.toLowerCase().replace(/\s+/g,''))}.html" target="_blank" rel="noopener">官方资料 ↗</a>`);
  if (has) h.push(`<span style="font-size:11px;color:var(--muted);">点击展开参数详解 ▾</span>`);
  h.push(`</div>`);
  if (has) {
    h.push(`<div class="detail"><div class="detail-title">输入参数 Inputs</div>${paramTable(c.inputs||[])}`);
    h.push(`<div class="detail-title">输出参数 Outputs</div>${paramTable(c.outputs||[])}`);
    if (c.example) h.push(`<div class="detail-title">示例</div><div class="example">${esc(c.example)}</div>`);
    if (c.note) h.push(`<div style="font-size:11px;color:var(--muted);margin-top:6px;">${esc(c.note)}</div>`);
    h.push(`</div>`);
  }
  h.push(`</article>`);
  return h.join("");
}

function render(){
  const list = filtered();
  const grid = $("#catalogGrid");
  grid.innerHTML = list.map(c => cardHTML(c, currentTerm)).join("");
  const empty = $("#emptyState");
  empty.style.display = list.length ? "none" : "block";
  $$(".catalog-card.has-detail").forEach(card => {
    card.onclick = (e) => {
      if (e.target.closest("a")) return;
      card.classList.toggle("expanded");
    };
  });
}

function showAutocomplete(term){
  const wrap = $("#autocomplete");
  const t = term.trim().toLowerCase();
  if (!t) { wrap.style.display="none"; return; }
  const matches = catalogData.filter(c => `${c.name} ${c.nick||""}`.toLowerCase().includes(t)).slice(0,8);
  if (!matches.length) { wrap.style.display="none"; return; }
  wrap.innerHTML = matches.map((c,i) =>
    `<div class="ac-item" style="padding:8px 12px" onclick="document.getElementById('searchInput').value='${esc(c.name)}'; currentTerm='${esc(c.name).toLowerCase()}'; wrap.style.display='none'; render();">
      <span class="ac-name">${mark(c.name, term)}</span>${c.nick?`<span class="ac-meta">(${c.nick})</span>`:''}
    </div>`
  ).join("");
  wrap.style.display="block";
}

async function init(){
  await loadCatalog();
  const langBtn = $("#langSwitch");
  const searchInput = $("#searchInput");
  const autocomplete = $("#autocomplete");

  const t = I18N_API.t;
  document.getElementById("pageTitle").textContent = t("componentCatalog") + " | GH Guide";
  document.getElementById("brandLink").innerHTML = "GH <span>" + t("brand") + "</span>";
  document.getElementById("brandLink").href = "../index.html?lang=" + (I18N_API.getLang());
  document.getElementById("backLink").href = "../index.html#catalog?lang=" + (I18N_API.getLang());
  document.getElementById("langNote").textContent = (I18N_API.getLang()==="zh" ? "中英双语 · 右上角切换" : "Bilingual CN/EN · switch top-right");
  document.getElementById("emptyText").textContent = I18N_API.t("noResults");
  searchInput.placeholder = I18N_API.t("searchPlaceholder");

  $("#statTotal").textContent = catalogData.length;
  $("#statDetailed").textContent = catalogData.filter(c => c.detail).length;

  renderFilters();
  render();

  langBtn.addEventListener("click", () => {
    I18N_API.setLang(I18N_API.getLang() === "zh" ? "en" : "zh");
    langBtn.textContent = I18N_API.t("langLabel");
    document.getElementById("pageTitle").textContent = t("componentCatalog") + " | GH Guide";
    document.getElementById("brandLink").innerHTML = "GH <span>" + t("brand") + "</span>";
    document.getElementById("langNote").textContent = (I18N_API.getLang()==="zh" ? "中英双语 · 右上角切换" : "Bilingual CN/EN · switch top-right");
    searchInput.placeholder = t("searchPlaceholder");
    renderFilters();
    render();
  });

  searchInput.addEventListener("input", (e) => {
    currentTerm = e.target.value.trim().toLowerCase();
    showAutocomplete(currentTerm);
    render();
  });
  searchInput.addEventListener("keydown", (e) => {
    const items = autocomplete.querySelectorAll(".ac-item");
    if (e.key === "ArrowDown") { e.preventDefault(); selectedIndex = Math.min(selectedIndex+1, items.length-1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); selectedIndex = Math.max(selectedIndex-1, -1); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const sel = autocomplete.querySelector(".ac-item.selected");
      if (sel) sel.click();
      return;
    } else if (e.key === "Escape") { autocomplete.style.display="none"; return; } else return;
    items.forEach((el,i) => el.classList.toggle("selected", i === selectedIndex));
  });
  autocomplete.addEventListener("click", (e) => {
    const item = e.target.closest(".ac-item");
    if (!item) return;
    searchInput.value = item.textContent.replace(/\(.*\)/,"").trim();
    currentTerm = searchInput.value.toLowerCase();
    autocomplete.style.display="none";
    render();
  });
  document.addEventListener("click", (e) => {
    if (!searchInput.contains(e.target) && !autocomplete.contains(e.target)) autocomplete.style.display="none";
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
