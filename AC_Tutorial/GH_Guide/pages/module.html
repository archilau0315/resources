<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">模块详情 | Module</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .module-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .module-emoji { font-size:32px; }
  .module-meta { font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--accent); font-weight:700; }
  .module-title { font-size:24px; font-weight:800; color:var(--text); margin-bottom:6px; line-height:1.3; }
  .module-desc { font-size:16px; color:var(--muted); line-height:1.7; margin-bottom:20px; }
  .module-info { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:24px; }
  .info-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .info-label { font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin-bottom:8px; font-weight:700; }
  .info-value { font-size:15px; color:var(--text); }
  .info-value.chip { display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; }
  .chip-beginner { background:#16653a; color:#bbf7d0; }
  .chip-intermediate { background:#7c2d12; color:#fed7aa; }
  .chip-advanced { background:#7f1d1d; color:#fecaca; }
  .doc-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
  .doc-title { font-size:18px; font-weight:800; color:var(--text); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .doc-sub { font-size:14px; color:var(--muted); margin-bottom:16px; }
  .btn-doc { display:inline-flex; align-items:center; gap:8px; padding:12px 24px; background:var(--accent); color:#000; border-radius:10px; font-weight:700; text-decoration:none; transition:all var(--transition); }
  .btn-doc:hover { background:var(--accent-hover); transform:translateY(-2px); }
  .related-title { font-size:15px; font-weight:800; color:var(--text); margin:24px 0 12px; display:flex; align-items:center; gap:8px; }
  .related-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .related-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; transition:all var(--transition); text-decoration:none; color:inherit; }
  .related-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .related-name { font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .related-desc { font-size:12px; color:var(--muted); line-height:1.4; }
  .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:14px; margin-bottom:20px; }
  .back-link:hover { text-decoration:underline; }
  .lang-note { font-size:12px; color:var(--muted); text-align:center; margin-top:24px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="container">
    <a href="../index.html" class="brand" id="brandLink">GH <span>指南</span></a>
    <div class="lang-switch" id="langSwitch">EN</div>
  </div>
</header>

<div class="container" style="padding-top:24px;">
  <a href="../index.html#course" class="back-link" id="backLink">← 返回课程地图</a>

  <div class="module-header">
    <span class="module-emoji" id="modEmoji">📖</span>
    <div>
      <div class="module-meta" id="modCategory">分类</div>
      <div class="module-title" id="modTitle">模块标题</div>
    </div>
  </div>

  <div class="module-desc" id="modDesc">模块描述</div>

  <div class="module-info">
    <div class="info-card">
      <div class="info-label" id="lblDifficulty">难度</div>
      <div class="info-value chip" id="modDifficulty" class="chip-beginner">初级</div>
    </div>
    <div class="info-card">
      <div class="info-label" id="lblDuration">时长</div>
      <div class="info-value" id="modTime">20 分钟</div>
    </div>
    <div class="info-card">
      <div class="info-label" id="lblPrereq">前置模块</div>
      <div class="info-value" id="modPrereq">无</div>
    </div>
    <div class="info-card">
      <div class="info-label" id="lblKeyComp">关键组件</div>
      <div class="info-value" id="modKeyComp">—</div>
    </div>
  </div>

  <div class="doc-card">
    <div class="doc-title" id="docTitle">阅读完整文档</div>
    <p class="doc-sub" id="docSub">点击下方按钮打开详细的 Markdown 文档（中英双语）</p>
    <a href="#" class="btn-doc" id="docLink">阅读文档 →</a>
  </div>

  <div class="related-title" id="relatedTitle">相关模块</div>
  <div class="related-grid" id="relatedGrid"></div>

  <div class="lang-note" id="langNote">中英双语 · 右上角切换</div>
</div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");
let lang = params.get("lang") || "zh";

document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
document.getElementById("langSwitch").textContent = lang === "zh" ? "EN" : "中文";

async function init() {
  await DataAPI.loadCurriculum();
  I18N_API.setLang(lang);

  const mod = DataAPI.findModule(id);
  if (!mod) {
    document.body.innerHTML = "<div style='padding:40px;text-align:center;color:var(--muted);'>模块未找到</div>";
    return;
  }

  const cat = DataAPI.getCategoryStyle(mod.category);
  const curLang = I18N_API.getLang();

  document.getElementById("pageTitle").textContent = mod.title[curLang] + " | GH Guide";
  document.getElementById("brandLink").href = "../index.html?lang=" + curLang;
  document.getElementById("brandLink").innerHTML = "GH <span>" + I18N_API.t("brand") + "</span>";
  document.getElementById("modEmoji").textContent = cat.emoji;
  document.getElementById("modCategory").textContent = cat[curLang];
  document.getElementById("modTitle").textContent = mod.title[curLang];
  document.getElementById("modDesc").textContent = mod.desc[curLang];

  const diffMap = { zh: { 初级: "chip-beginner", 中级: "chip-intermediate", 高级: "chip-advanced" }, en: { Beginner: "chip-beginner", Intermediate: "chip-intermediate", Advanced: "chip-advanced" } };
  document.getElementById("modDifficulty").textContent = mod.difficulty;
  document.getElementById("modDifficulty").className = "info-value chip " + diffMap[curLang][mod.difficulty];
  document.getElementById("modTime").textContent = mod.time;
  document.getElementById("modPrereq").textContent = mod.prerequisites.length ? mod.prerequisites.join(" → ") : I18N_API.t("prerequisites") + ": 无";
  document.getElementById("modKeyComp").textContent = mod.keyComponents.join("、");

  document.getElementById("docLink").href = mod.file + "?lang=" + curLang;
  document.getElementById("docLink").textContent = I18N_API.t("readModule") + " →";
  document.getElementById("backLink").href = "../index.html#course?lang=" + curLang;

  const noteMap = { zh: "中英双语 · 右上角切换", en: "Bilingual CN/EN · switch top-right" };
  document.getElementById("langNote").textContent = noteMap[curLang];

  // 相关模块（同类别或前置/后继）
  const allMods = DataAPI.getModules();
  const related = allMods.filter(m => m.id !== id && (m.category === mod.category || mod.prerequisites.includes(m.id) || m.prerequisites.includes(id)));
  const grid = document.getElementById("relatedGrid");
  grid.innerHTML = related.slice(0, 4).map(m => {
    const c = DataAPI.getCategoryStyle(m.category);
    return `<a class="related-card" href="module.html?id=${m.id}&lang=${curLang}">
      <div class="related-name">${m.title[curLang]}</div>
      <div class="related-desc">${m.desc[curLang].slice(0, 80)}...</div>
    </a>`;
  }).join("");

  document.getElementById("langSwitch").addEventListener("click", () => {
    const next = lang === "zh" ? "en" : "zh";
    location.href = "module.html?id=" + id + "&lang=" + next;
  });
}

init();
</script>
</body>
</html>
