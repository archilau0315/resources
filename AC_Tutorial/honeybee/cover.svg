<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Honeybee 组件速查与系统教程">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a12"/>
      <stop offset="0.5" stop-color="#b06a12"/>
      <stop offset="1" stop-color="#f2b33d"/>
    </linearGradient>
    <pattern id="comb" width="34" height="30" patternUnits="userSpaceOnUse">
      <path d="M8.5 2 L17 7 L17 17 L8.5 22 L0 17 L0 7 Z"
            fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
      <path d="M25.5 17 L34 22 L34 32 L25.5 37 L17 32 L17 22 Z"
            fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffd88a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd88a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#comb)"/>
  <rect width="300" height="300" fill="url(#glow)"/>

  <!-- 组件连线 -->
  <g stroke="#fff8e6" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M24 84 H70 Q82 84 82 96 V120"/>
    <path d="M24 216 H70 Q82 216 82 204 V180"/>
    <path d="M206 120 V180"/>
    <path d="M206 150 H276"/>
  </g>

  <!-- 组件节点 -->
  <g fill="#ffffff" fill-opacity="0.10" stroke="#fff8e6" stroke-opacity="0.5" stroke-width="1.6">
    <rect x="58" y="50" width="48" height="34" rx="7"/>
    <rect x="58" y="216" width="48" height="34" rx="7"/>
    <rect x="182" y="120" width="48" height="60" rx="7"/>
  </g>
  <g fill="#ffe6a8">
    <circle cx="70" cy="62" r="2.6"/>
    <circle cx="70" cy="72" r="2.6"/>
    <circle cx="218" cy="134" r="2.6"/>
    <circle cx="218" cy="166" r="2.6"/>
  </g>

  <!-- 主标题 -->
  <text x="150" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-2">HB</text>
  <text x="150" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" fill="#fff8e6" letter-spacing="1.5">HONEYBEE</text>
  <text x="150" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#ffe6a8" letter-spacing="0.6">412 组件速查 · 22 篇教程</text>
  <text x="150" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="9" fill="#ffe6a8" fill-opacity="0.8" letter-spacing="0.4">Ladybug Tools 1.9 · Bilingual Reference</text>

  <!-- 角标 -->
  <text x="288" y="288" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="9" fill="#ffffff" fill-opacity="0.55">KBIT AI</text>
</svg>
