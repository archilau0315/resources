<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honeybee 组件速查与教程 · Ladybug Tools 1.9</title>
<meta name="description" content="Ladybug Tools 全量 412 个组件的中英速查手册与系统化教程">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#" onclick="window._hb.go('ref');return false;">
    <span class="brand-mark">HB</span>
    <span class="brand-text">
      <b>Honeybee 速查与教程</b>
      <small>Ladybug Tools 1.9 · 412 组件 · 中英对照</small>
    </span>
  </a>
  <nav class="view-nav" id="view-nav">
    <button data-view="ref" class="active">组件速查</button>
    <button data-view="doc">系统教程</button>
    <button data-view="terms">术语表</button>
  </nav>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜索组件名、昵称、端口、说明...">
    <span id="search-count" class="search-count"></span>
  </div>
  <button id="theme-toggle" class="theme-toggle" title="切换主题">◐</button>
</header>

<main class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title" id="sidebar-title">分类</span>
      <span class="sidebar-count" id="sidebar-count"></span>
    </div>
    <nav id="category-nav"></nav>
    <div class="sidebar-footer">
      <a href="https://docs.ladybug.tools/honeybee-primer/" target="_blank" rel="noopener">Honeybee Primer ↗</a>
      <a href="https://discourse.ladybug.tools/" target="_blank" rel="noopener">官方论坛 ↗</a>
      <div class="sidebar-social">
        <a href="https://github.com/ladybug-tools" target="_blank" rel="noopener" title="Ladybug Tools 源码">GH</a>
        <a href="https://www.kbitai.com.cn/" target="_blank" rel="noopener" title="KBIT AI">KB</a>
      </div>
    </div>
  </aside>

  <section class="content" id="content">
    <div class="content-header">
      <h1 id="content-title">全部组件</h1>
      <span id="content-count" class="content-count"></span>
    </div>
    <div id="grid" class="grid"></div>
    <div id="doc-view" class="doc-view" hidden></div>
    <div id="terms-view" class="terms-view" hidden></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">◎</div>
      <div class="empty-text">没找到匹配内容</div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="loading" class="loading">
  <div class="loading-spinner"></div>
  <div>加载组件数据...</div>
</div>

<footer class="site-footer">

</body>
</html>
